syntax = "proto3";

import "confluent/meta.proto";
import "confluent/type/decimal.proto";
import "confluent/type/variant.proto";
import "google/protobuf/timestamp.proto";

package io.confluent.kafka.schemaregistry.rules;

option java_package = "io.confluent.kafka.schemaregistry.rules";
option java_outer_classname = "CelValueTypesProto";
option java_multiple_files = false;

// The message types a CEL rule treats as a single value, alongside a plain numeric field so
// that a decimal result targeting a number can be told apart from one targeting a Decimal.
message ValueTypes {
    .confluent.type.Decimal amount = 1 [(.confluent.field_meta).tags = "AMOUNT"];
    google.protobuf.Timestamp ts = 2 [(.confluent.field_meta).tags = "TS"];
    .confluent.type.Variant data = 3 [(.confluent.field_meta).tags = "DATA"];
    string label = 4;
    double ratio = 5 [(.confluent.field_meta).tags = "RATIO"];
}
